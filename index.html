<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Lives Here 쿠지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: one stage where the ticket opens, then the flat net of all four printed faces */
:root{
  --bg:#eef1f7; --surface:#ffffff; --fg:#26304a; --muted:#6a7590; --line:#cdd4e4;
  --accent:#5f6fb0; --table:#dde2ee;
  --display:"Gaegu","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141824; --surface:#1d2333; --fg:#e6eaf5; --muted:#9aa4bf; --line:#323a50;
  --accent:#9fb0f0; --table:#1a1f2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1d2333; --fg:#e6eaf5; --muted:#9aa4bf; --line:#323a50;
  --accent:#9fb0f0; --table:#1a1f2e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(34px,6vw,52px);line-height:1;margin:0;color:var(--accent);text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}

/* stage */
.stage{background:var(--table);border-radius:18px;padding:clamp(20px,5vw,56px) clamp(12px,3vw,32px);overflow:hidden}
.track{position:relative;width:100%;max-width:880px;margin:0 auto;aspect-ratio:880/470}
.ticket{--w:46%;position:absolute;bottom:0;left:calc(50% - var(--w)/2);width:var(--w);aspect-ratio:709/473;
  perspective:1400px;transform:translateY(-38%);transition:transform .7s cubic-bezier(.6,.05,.25,1)}
.stage.open .ticket{transform:none}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.6,.05,.25,1)}
.stage.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:3%/4.5%;overflow:hidden;backface-visibility:hidden;
  background-size:100% 100%;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 28px -10px rgba(20,30,60,.45),0 2px 4px rgba(20,30,60,.2)}
.front{background-image:var(--f1)}
.back{background-image:var(--f3);transform:rotateY(180deg)}
.front{overflow:visible;transform-style:preserve-3d}
.win{transform-style:preserve-3d;transition:visibility 0s linear .4s}
.stage.flipped .win{visibility:hidden}

/* the perforated window: inset 4% x / 9% y */
.win{position:absolute;left:4%;top:9%;width:92%;height:82%}
.reveal{position:absolute;inset:0;background-image:var(--f4);background-size:108.7% 122%;background-position:center;
  box-shadow:inset 0 3px 8px rgba(20,30,60,.35), inset 0 0 0 1px rgba(20,30,60,.15)}
.flap{position:absolute;inset:0;transform-origin:50% 0;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.55,.05,.2,1) .15s;cursor:pointer}
.stage.open .flap{transform:rotateX(168deg)}
.flap .side{position:absolute;inset:0;backface-visibility:hidden;background-size:108.7% 122%;background-position:center}
.flap .out{background-image:var(--f1);outline:1.5px dashed rgba(255,255,255,.85);outline-offset:-1px}
.flap .in{background-image:var(--f2);transform:rotateX(180deg);box-shadow:0 10px 22px -10px rgba(20,30,60,.5)}
.flap .in::after{content:"";position:absolute;inset:0;outline:1.5px dashed rgba(255,255,255,.6);outline-offset:-1px;
  background:linear-gradient(0deg,rgba(0,0,0,.08),transparent 30%)}
.tab{position:absolute;left:50%;bottom:-4.2%;width:4.5%;aspect-ratio:1;transform:translateX(-50%) rotate(45deg);
  background:inherit;background:var(--f1-tab, rgba(255,255,255,.55));border:1.5px dashed rgba(255,255,255,.9);border-left:0;border-top:0;backface-visibility:hidden}
.hint{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);font-size:12px;font-weight:600;color:var(--muted);
  white-space:nowrap;pointer-events:none;transition:opacity .3s}
.stage.open .hint,.stage.flipped .hint{opacity:0}

.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:clamp(18px,4vw,36px)}
button{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:10px 20px;cursor:pointer;
  border:1.5px solid var(--accent);background:var(--accent);color:var(--surface)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.state{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;min-height:1.6em}

/* net */
h2{font-family:var(--display);font-size:28px;margin:0 0 4px;color:var(--fg)}
.net{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:760px){.net{grid-template-columns:repeat(2,minmax(0,1fr))}}
figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
figure img{width:100%;aspect-ratio:709/473;border-radius:8px;border:1px solid var(--line);display:block}
figcaption{display:flex;flex-direction:column;font-size:13px;line-height:1.45}
figcaption b{font-weight:600}
figcaption span{color:var(--muted)}
.code{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;margin-right:4px}

@media (prefers-reduced-motion:reduce){.ticket,.card,.flap{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Kuji ticket mockup · 709 × 473</span>
    <h1>OPEN!</h1>
    <p>절취선 날개를 눌러 뜯으면 날개 안쪽에 당첨 등급(A)이, 창 안에 엿보는 캐릭터가 나타납니다. 뒷면 보기로 "Who lives here?" 면을 확인할 수 있어요.</p>
  </header>

  <section class="stage" id="stage">
    <div class="track">
      <div class="ticket">
        <div class="card">
          <div class="face front">
            <div class="win">
              <div class="reveal" aria-label="뒤 내부: 엿보는 캐릭터"></div>
              <div class="flap" id="flap" role="button" tabindex="0" aria-label="절취선 날개 열기">
                <div class="side out"></div>
                <div class="side in"></div>
                <div class="tab" aria-hidden="true"></div>
              </div>
            </div>
            <span class="hint">▲ 아래 탭을 잡고 위로 뜯어요</span>
          </div>
          <div class="face back" aria-label="뒤 외부: Who lives here?"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="openBtn" type="button">개봉하기</button>
      <button id="flipBtn" type="button" class="ghost">뒷면 보기</button>
    </div>
    <div class="state" id="state">앞·외부: OPEN!</div>
  </section>

    <h2>인쇄면 전개</h2>

const stage=document.getElementById('stage'),openBtn=document.getElementById('openBtn'),
      flipBtn=document.getElementById('flipBtn'),flap=document.getElementById('flap'),st=document.getElementById('state');
function render(){
  const o=stage.classList.contains('open'),f=stage.classList.contains('flipped');
  openBtn.textContent=o?'다시 닫기':'개봉하기';
  flipBtn.textContent=f?'앞면 보기':'뒷면 보기';
  openBtn.disabled=f; openBtn.style.opacity=f?.4:1;
  st.textContent=f?'뒤·외부: Who lives here?':(o?'날개 안쪽 A상 + 창 안 캐릭터 공개':'앞·외부: OPEN!');
}
function toggleOpen(){ if(stage.classList.contains('flipped'))return; stage.classList.toggle('open'); render(); }
openBtn.onclick=toggleOpen;
flap.onclick=toggleOpen;
flap.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleOpen();}};
flipBtn.onclick=()=>{ if(stage.classList.contains('open')){stage.classList.remove('open');setTimeout(()=>{stage.classList.toggle('flipped');render();},700);render();return;} stage.classList.toggle('flipped'); render(); };
render();
</script>
